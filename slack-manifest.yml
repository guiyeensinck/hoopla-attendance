# Manifest de la app de Slack — reemplazá TU-DOMINIO por tu APP_URL (sin https://)
# api.slack.com/apps → tu app → App Manifest → pegar → Save → reinstalar la app
display_information:
  name: Hoopla Asistencia
  description: Registro de asistencia y horas por marca
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Asistencia
    always_online: true
  slash_commands:
    - command: /ayuda
      url: https://TU-DOMINIO/slack/events
      description: Cómo funciona la asistencia
      should_escape: false
    - command: /marcar
      url: https://TU-DOMINIO/slack/events
      description: Link para tu próxima marcación
      should_escape: false
    - command: /cargar
      url: https://TU-DOMINIO/slack/events
      description: Cargar en qué marcas trabajaste
      should_escape: false
    - command: /horarios
      url: https://TU-DOMINIO/slack/events
      description: Tu día, tu semana y tu saldo
      should_escape: false
    - command: /proyectos
      url: https://TU-DOMINIO/slack/events
      description: Catálogo y lo que llevás imputado
      should_escape: false
    - command: /misemana
      url: https://TU-DOMINIO/slack/events
      description: Tu semana en proyectos (web)
      should_escape: false
    - command: /admin
      url: https://TU-DOMINIO/slack/events
      description: Gestión (solo admins)
      usage_hint: "[comando]"
      should_escape: true
oauth_config:
  scopes:
    bot:
      - chat:write          # mensajes y DMs
      - im:history          # leer lo que la gente le escribe al bot por DM
      - im:write            # abrir DMs
      - users:read          # nombres y presencia (active/away)
      - files:write         # Excel mensual
      - commands            # comandos /
      - channels:history    # hora de mensajes en canales públicos (actividad)
      - groups:history      # ídem en privados donde invitaron al bot
      - reactions:read      # hora de reacciones (actividad)
      - channels:read       # admin canales: listar canales públicos
      - channels:join       # admin canales: sumarse a los públicos
settings:
  event_subscriptions:
    request_url: https://TU-DOMINIO/slack/events
    bot_events:
      - message.im
      - message.channels
      - message.groups
      - reaction_added
  interactivity:
    is_enabled: true
    request_url: https://TU-DOMINIO/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
